<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site_title }}{% if page and page.title %} - {{ page.title }}{% elif title %} - {{ title }}{% endif %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="backdrop backdrop-a"></div>
  <div class="backdrop backdrop-b"></div>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-mark">SDM</span>
      <span class="brand-text">Software Development Modernization</span>
    </a>
    <nav class="nav">
      <a href="{{ url_for('index') }}">Home</a>
      <a href="{{ url_for('labs_index') }}">Labs</a>
      <a href="{{ url_for('page_detail', slug='course-design') }}">Design</a>
      <a href="{{ url_for('page_detail', slug='implementation-plan') }}">Plan</a>
      <a href="{{ url_for('page_detail', slug='missing-items') }}">Gaps</a>
      <a href="{{ url_for('sitemap') }}">Sitemap</a>
    </nav>
  </header>
  <main class="shell">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
